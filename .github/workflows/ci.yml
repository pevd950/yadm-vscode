name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm test
      - run: npm run package -- --out yadm-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: yadm-vscode
          path: yadm-vscode.vsix
