name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm test
      - name: Package VSIX
        run: npm run package -- --out "yadm-vscode-${GITHUB_REF_NAME#v}.vsix"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "yadm-vscode-${GITHUB_REF_NAME#v}.vsix" --generate-notes --verify-tag
